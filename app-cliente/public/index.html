<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!--
      Favicon del cliente (logo blanco "app clientes"), servido desde public/.
      El "?v=" cambia la URL para que el navegador no reutilice un favicon viejo
      guardado en su caché: si se cambia el ícono, subir este número.
    -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <!-- Estilos base recomendados por react-native-web -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background-color: #fff6ee;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Necesita habilitar JavaScript para usar esta aplicación.</noscript>
    <div id="root"></div>
  </body>
</html>
